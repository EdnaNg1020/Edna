<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff6bb5",
                        "background-light": "#f8f5f7",
                        "background-dark": "#1a1a2e",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply font-display;
            }
        }
        .bg-pattern {
            background-image: radial-gradient(#ff6bb5 0.5px, transparent 0.5px), radial-gradient(#ff6bb5 0.5px, transparent 0.5px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            opacity: 0.12;
        }
        @keyframes snake-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .snake-circle {
            animation: snake-rotate 2.5s infinite linear;
        }
        @keyframes motion-trail {
            0% { stroke-dashoffset: 0; opacity: 0.4; }
            50% { stroke-dashoffset: -100; opacity: 0.1; }
            100% { stroke-dashoffset: -200; opacity: 0.4; }
        }
        .motion-trail-ring {
            animation: motion-trail 3s infinite linear;
        }
        @keyframes progress-pulse {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(255,107,181,0.4)); }
            50% { opacity: 0.8; filter: drop-shadow(0 0 2px rgba(255,107,181,0.1)); }
        }
        .pulse-soft {
            animation: progress-pulse 2s infinite ease-in-out;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(var(--tw-rotate)); }
            50% { transform: translateY(-15px) rotate(calc(var(--tw-rotate) + 5deg)); }
        }
        .float-icon {
            animation: floating 4s infinite ease-in-out;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .animate-shimmer {
            animation: shimmer 2s infinite linear;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center overflow-hidden transition-colors duration-500">
<div class="fixed top-[15%] left-[10%] text-primary/15 dark:text-primary/10 select-none pointer-events-none float-icon [--tw-rotate:12deg]">
<span class="material-icons text-8xl">extension</span>
</div>
<div class="fixed bottom-[15%] right-[10%] text-primary/15 dark:text-primary/10 select-none pointer-events-none float-icon [--tw-rotate:-12deg]">
<span class="material-icons text-8xl">videogame_asset</span>
</div>
<div class="fixed top-[45%] left-[5%] text-primary/10 dark:text-primary/5 select-none pointer-events-none float-icon [--tw-rotate:0deg]">
<span class="material-icons text-9xl">stars</span>
</div>
<div class="fixed inset-0 bg-pattern pointer-events-none"></div>
<main class="relative z-10 flex flex-col items-center w-full max-w-2xl px-6 text-center">
<div class="mb-10 relative flex items-center justify-center">
<div class="absolute w-56 h-56 bg-primary/20 rounded-full blur-3xl pulse-soft hidden dark:block"></div>
<svg class="absolute w-52 h-52 opacity-20 motion-trail-ring" viewBox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="48" stroke="#ff6bb5" stroke-dasharray="4 8" stroke-width="1"></circle>
</svg>
<div class="relative w-40 h-40 snake-circle">
<svg class="w-full h-full drop-shadow-xl" viewBox="0 0 100 100">
<circle class="opacity-20" cx="50" cy="50" fill="transparent" r="40" stroke="#ff6bb5" stroke-dasharray="160 360" stroke-linecap="round" stroke-width="10"></circle>
<circle cx="50" cy="50" fill="transparent" r="40" stroke="#ff6bb5" stroke-dasharray="100 260" stroke-linecap="round" stroke-width="12"></circle>
<circle cx="85" cy="30" fill="#ff6bb5" r="9"></circle>
<circle cx="88" cy="27" fill="white" r="2.5"></circle>
</svg>
</div>
<div class="absolute flex items-center justify-center">
<span class="material-icons text-primary text-5xl">sports_esports</span>
</div>
</div>
<div class="mb-10">
<h1 class="text-4xl font-extrabold text-primary mb-3 tracking-tight">
                正在加載遊戲...
            </h1>
<p class="text-primary/60 dark:text-primary/50 font-semibold text-lg tracking-wide">
                Edna's Game Center
            </p>
</div>
<div class="w-full max-w-md mx-auto">
<div class="bg-primary/10 dark:bg-white/5 h-6 w-full rounded-full p-1.5 shadow-inner relative">
<div class="bg-primary h-full w-[75%] rounded-full shadow-lg relative overflow-hidden transition-all duration-500">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/40 to-transparent -translate-x-full animate-shimmer"></div>
</div>
</div>
<div class="mt-4 flex justify-between items-center text-primary/80 dark:text-primary/60 font-bold px-0.5">
<span class="text-xs uppercase tracking-widest">INITIALISING ASSETS</span>
<span class="text-xs">75%</span>
</div>
</div>
<div class="mt-12 p-6 bg-white/60 dark:bg-white/5 backdrop-blur-xl rounded-2xl border border-primary/20 dark:border-white/10 w-full max-w-sm mx-auto shadow-xl">
<div class="flex items-center justify-center gap-2 text-primary mb-3">
<span class="material-symbols-outlined text-xl">lightbulb</span>
<span class="font-extrabold text-xs uppercase tracking-widest">每日小提示</span>
</div>
<p class="text-gray-600 dark:text-gray-300 font-medium text-sm leading-relaxed">
                在 2048 中，試著將最大的數字保持在角落，這樣可以更容易地進行堆疊！
            </p>
</div>
</main>
<footer class="fixed bottom-10 text-primary/40 dark:text-primary/30 font-bold tracking-[0.2em] text-[10px] uppercase z-10 w-full text-center">
        © 2024 EDNA'S ARCADE • VERSION 1.0.4
    </footer>
